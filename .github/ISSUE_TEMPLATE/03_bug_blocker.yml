name: "Bug / Blocker (Báo lỗi hoặc Rào cản)"
description: "Báo sớm lỗi kỹ thuật, sai dữ liệu hoặc rào cản tiến độ (đặc biệt trên đường găng)"
title: "[BLOCKER] <Mô tả ngắn lỗi hoặc rào cản>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Khuyến khích báo sớm ngay khi gặp rào cản dữ liệu, môi trường GPU, lỗi tensor hoặc nguy cơ trễ mốc để nhóm cùng tháo gỡ kịp thời.

  - type: dropdown
    id: impact
    attributes:
      label: "Mức độ ảnh hưởng tiến độ"
      options:
        - "Khẩn cấp — Chặn đầu việc trên Đường găng (Critical Path)"
        - "Cao — Ảnh hưởng kết quả thực nghiệm / sai số liệu"
        - "Trung bình / Nhỏ — Có phương án tạm thời"
    validations:
      required: true

  - type: input
    id: related_wp
    attributes:
      label: "Work Package / Run ID bị ảnh hưởng"
      placeholder: "Ví dụ: WP-2.2 hoặc S2-01"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Mô tả chi tiết & Cách tái lập"
      value: |
        **Hiện tượng / Lỗi gặp phải:**
        -

        **Các bước tái lập hoặc log lỗi:**
        ```text

        ```

        **Đề xuất hướng xử lý hoặc hỗ trợ cần từ nhóm:**
        -
    validations:
      required: true

